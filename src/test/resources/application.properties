spring.application.name=backend-test

# Use in-memory H2 database for hermetic, fast, and isolated testing
spring.datasource.url=jdbc:h2:mem:educompasstest;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test CORS origins
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Test JWT configuration
app.jwt.secret=c7f8a9e1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9
app.jwt.expiration-ms=86400000
app.jwt.remember-expiration-ms=604800000
app.google.client-id=
